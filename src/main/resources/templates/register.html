<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topbar"><a class="brand" href="/">Online Shop Java Platform</a><div class="nav"><a href="/login">Login</a></div></nav>
<main class="container panel">
    <h1>Create Customer Account</h1>
    <form class="stack" method="post" action="/register">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Password <input name="password" type="password" minlength="8" required></label>
        <label>Address <input name="address" required></label>
        <button class="btn primary" type="submit">Register</button>
    </form>
</main>
</body>
</html>
