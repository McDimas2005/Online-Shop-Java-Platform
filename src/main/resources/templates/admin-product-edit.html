<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Product</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topbar"><a class="brand" href="/admin/products">Product Management</a><div class="nav"><a href="/admin/dashboard">Dashboard</a><a href="/admin/stock">Stock</a></div></nav>
<main class="container panel">
    <h1 th:text="'Edit ' + ${product.productName}">Edit Product</h1>
    <p><span class="badge" th:text="${product.category()}">Category</span></p>
    <form class="stack" method="post" th:action="@{/admin/products/{id}/edit(id=${product.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="productCode" th:value="${productForm.productCode}">
        <label>Product ID <input th:value="${productForm.productCode}" disabled></label>
        <label>Name <input name="productName" th:value="${productForm.productName}" required></label>
        <label>Price <input name="price" type="number" step="0.01" min="0.01" th:value="${productForm.price}" required></label>
        <label>Stock <input name="quantityInStock" type="number" min="0" th:value="${productForm.quantityInStock}" required></label>
        <label th:if="${product.category().name() == 'CLOTHING'}">Size <input name="size" th:value="${productForm.size}" required></label>
        <label th:if="${product.category().name() == 'ELECTRONICS'}">Brand <input name="brand" th:value="${productForm.brand}" required></label>
        <label th:if="${product.category().name() == 'ELECTRONICS'}">Warranty Years <input name="warrantyPeriodYears" type="number" min="0" th:value="${productForm.warrantyPeriodYears}" required></label>
        <button class="btn primary" type="submit">Save Product</button>
    </form>
</main>
</body>
</html>
