<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Products</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topbar"><a class="brand" href="/admin">Admin</a><div class="nav"><a href="/admin/stock">Stock</a><a href="/admin/orders">Orders</a></div></nav>
<main class="container">
    <h1>Product Management</h1>
    <section class="grid">
        <form class="panel stack" method="post" action="/admin/products/clothing">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2>Add Clothing</h2>
            <label>ID <input name="productCode" required></label><label>Name <input name="productName" required></label><label>Price <input name="price" type="number" step="0.01" min="0.01" required></label><label>Stock <input name="quantityInStock" type="number" min="0" required></label><label>Size <input name="size" required></label>
            <button class="btn primary" type="submit">Add Clothing</button>
        </form>
        <form class="panel stack" method="post" action="/admin/products/electronics">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2>Add Electronics</h2>
            <label>ID <input name="productCode" required></label><label>Name <input name="productName" required></label><label>Price <input name="price" type="number" step="0.01" min="0.01" required></label><label>Stock <input name="quantityInStock" type="number" min="0" required></label><label>Brand <input name="brand" required></label><label>Warranty Years <input name="warrantyPeriodYears" type="number" min="0" required></label>
            <button class="btn primary" type="submit">Add Electronics</button>
        </form>
    </section>
    <h2>All Products</h2>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead>
        <tbody><tr th:each="product : ${products}"><td th:text="${product.productCode}">ID</td><td th:text="${product.productName}">Name</td><td th:text="${product.category()}">Category</td><td th:text="${'$' + product.price}">Price</td><td th:text="${product.quantityInStock}">Stock</td><td th:text="${product.active}">Active</td><td><form method="post" th:action="@{/admin/products/{id}/deactivate(id=${product.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger" type="submit">Deactivate</button></form></td></tr></tbody>
    </table>
</main>
</body>
</html>
