<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topbar"><a class="brand" href="/customer/dashboard">Customer Dashboard</a><div class="nav"><a href="/products">Catalog</a><a href="/cart">Cart</a><a href="/orders">Orders</a><a href="/profile">Profile</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Logout</button></form></div></nav>
<main class="container">
    <h1 th:text="'Welcome, ' + ${user.name}">Welcome</h1>
    <section class="grid">
        <article class="panel"><h2>Recent Orders</h2><p th:if="${#lists.isEmpty(orders)}">No orders yet.</p><p th:each="order : ${orders}"><a th:href="@{/orders/{id}/tracking(id=${order.id})}" th:text="${order.orderNumber}">Order</a> <span class="badge" th:text="${order.status}">Status</span></p></article>
        <article class="panel"><h2>Featured Products</h2><p th:each="product : ${products}"><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.productName}">Product</a></p></article>
    </section>
</main>
</body>
</html>
