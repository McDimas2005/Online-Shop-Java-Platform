<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cart</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topbar"><a class="brand" href="/dashboard">Customer Dashboard</a><div class="nav"><a href="/products">Catalog</a><a href="/orders">Orders</a></div></nav>
<main class="container">
    <h1>Shopping Cart</h1>
    <table>
        <thead><tr><th>Product</th><th>Unit Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(cart.items)}"><td colspan="5">Your cart is empty.</td></tr>
        <tr th:each="item : ${cart.items}">
            <td th:text="${item.product.productName}">Product</td>
            <td th:text="${'$' + item.product.price}">$0</td>
            <td>
                <form class="inline" method="post" th:action="@{/cart/items/{id}/update(id=${item.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input name="quantity" type="number" min="1" th:value="${item.quantity}" style="width:90px">
                    <button class="btn" type="submit">Update</button>
                </form>
            </td>
            <td th:text="${'$' + item.subtotal()}">$0</td>
            <td><form method="post" th:action="@{/cart/items/{id}/remove(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger" type="submit">Remove</button></form></td>
        </tr>
        </tbody>
    </table>
    <section class="panel" style="margin-top:16px">
        <h2 th:text="${'Cart Total: $' + cart.total()}">Total</h2>
        <form method="post" action="/checkout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn primary" type="submit" th:disabled="${#lists.isEmpty(cart.items)}">Checkout</button>
        </form>
    </section>
</main>
</body>
</html>
